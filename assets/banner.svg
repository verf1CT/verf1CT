<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-label="Mikhail Meshkoy — verf1CT">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#161b29"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>

  <!-- floating dots grid -->
  <g fill="#1f2740">
    <circle cx="1060" cy="60" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="120" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="70" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="220" r="2.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="200" r="2"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- name -->
  <text x="70" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="#f0f6fc" filter="url(#glow)">
    Mikhail Meshkoy
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
  </text>

  <!-- handle -->
  <text x="74" y="170" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" font-weight="600" fill="#8b5cf6">
    @verf1CT
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
  </text>

  <!-- tagline -->
  <text x="72" y="215" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="500" fill="#8b949e">
    From idea to production — solo, full-stack, fast
    <animate attributeName="opacity" from="0" to="1" dur="1.8s" fill="freeze"/>
  </text>

  <!-- animated accent underline -->
  <rect x="72" y="235" width="520" height="4" rx="2" fill="url(#accent)"/>

  <!-- ship it chip -->
  <g>
    <rect x="72" y="255" width="132" height="30" rx="15" fill="#161b29" stroke="#3b82f6" stroke-opacity="0.4"/>
    <text x="90" y="275" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#58a6ff">ship it 🚀</text>
  </g>
</svg>
